<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tótem · Reserva de fichas · Clínica MedicalCenter</title>
    <meta name="description" content="Demo del tótem táctil de Clínica MedicalCenter: reserve su ficha sin registrarse, elija médico y horario, y pague con QR.">
    <link rel="icon" href="https://medicalcenter.bo/wp-content/uploads/2021/05/cropped-logo-32x32.png">
    <meta name="theme-color" content="#f6fbf9">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Demo · Tótem de reserva de fichas · Clínica MedicalCenter">
    <meta property="og:description" content="Reserve su ficha sin registrarse desde el tótem táctil: especialidad, médico, horario y pago con QR. Demo de Servisofts S.R.L.">
    <meta property="og:image" content="https://medicalcenterbo.github.io/assets/og-image.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="totem.css">
</head>
<body>

<!-- ============ FONDO (auroras suaves y retícula) ============ -->
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- ============ PANTALLA DE ESPERA ============ -->
<section class="idle" id="idle" aria-label="Pantalla de inicio del tótem">
    <header class="idle__top">
        <img class="idle__logo" src="../assets/logo.png" alt="Clínica MedicalCenter">
        <div class="idle__status"><span class="live"></span>Sistema en línea<b id="idle-clock"></b></div>
    </header>

    <div class="idle__center">
        <div class="orb" aria-hidden="true">
            <span class="orb__ring orb__ring--1"></span>
            <span class="orb__ring orb__ring--2"></span>
            <span class="orb__ring orb__ring--3"></span>
            <span class="orb__core"><svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span>
        </div>
        <p class="idle__kicker">Autoservicio · Reserva de fichas</p>
        <h1>Reserve su ficha<br><span>en menos de 2 minutos</span></h1>
        <p class="idle__rot" id="idle-rot" aria-live="polite"></p>
        <button class="idle__touch" id="idle-start" type="button">
            <span class="idle__touch-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 013 0V11m0-1.5a1.5 1.5 0 013 0V11m0-.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1.2a6 6 0 01-4.5-2L4.2 16a1.6 1.6 0 012.3-2.2L9 16V11"/></svg></span>
            Toque para comenzar
        </button>
    </div>

    <svg class="ecg" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path class="ecg__base" d="M0 60H380l30 0 15-30 15 60 15-80 20 100 15-50H700l20 0 15-15 15 30 15-15H1200"/>
        <path class="ecg__pulse" d="M0 60H380l30 0 15-30 15 60 15-80 20 100 15-50H700l20 0 15-15 15 30 15-15H1200"/>
    </svg>

    <div class="idle__foot">
        <span>Sede Cristo Redentor · Atención las 24 horas</span>
        <span class="idle__demo">Modo demostración · datos ficticios</span>
        <a href="../#portal" class="idle__exit">Salir de la demo</a>
    </div>
</section>

<!-- ============ APLICACIÓN DEL TÓTEM ============ -->
<div class="kiosk" id="kiosk" hidden>
    <header class="top">
        <img class="top__logo" src="../assets/logo.png" alt="Clínica MedicalCenter">
        <div class="top__title">
            <button class="top__back" id="btn-back" type="button" data-a="atras" aria-label="Volver al paso anterior" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div><b id="step-title"></b><small id="step-sub"></small></div>
        </div>
        <div class="top__right">
            <div class="top__clock"><b id="clock"></b><small id="date"></small></div>
            <button class="top__home" id="btn-home" type="button" aria-label="Volver al inicio">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Inicio</span>
            </button>
        </div>
    </header>

    <nav class="steps" id="steps" aria-label="Progreso de la reserva"></nav>

    <div class="stage">
        <div class="screenwrap">
            <main class="screen" id="screen" aria-live="polite"></main>
            <button class="kbtoggle" id="kbtoggle" type="button" aria-pressed="false" hidden aria-label="Usar el teclado en pantalla del tótem" title="Teclado del tótem">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 13.5h.01M18 13.5h.01M9 15.5h6"/></svg>
                <i class="kbtoggle__sw" aria-hidden="true"></i>
            </button>
        </div>
        <aside class="summary" id="summary" aria-label="Resumen de su reserva"></aside>
    </div>

    <footer class="actions" id="actions"></footer>
</div>

<!-- ============ TECLADO EN PANTALLA ============ -->
<div class="kb" id="kb" hidden>
    <div class="kb__panel" role="dialog" aria-label="Teclado en pantalla">
        <div class="kb__head"><span id="kb-label"></span><div class="kb__value" id="kb-value"></div></div>
        <div class="kb__keys" id="kb-keys"></div>
    </div>
</div>

<!-- ============ AVISO DE INACTIVIDAD ============ -->
<div class="modal" id="idle-modal" hidden>
    <div class="modal__box" role="alertdialog" aria-labelledby="im-title">
        <div class="modal__count" id="im-count">15</div>
        <h2 id="im-title">¿Necesita más tiempo?</h2>
        <p>Por seguridad, la reserva se cancelará y el tótem volverá al inicio.</p>
        <div class="modal__btns">
            <button class="btn btn--ghost" id="im-exit" type="button">Terminar</button>
            <button class="btn btn--primary" id="im-stay" type="button">Sí, continuar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>
<button class="fs" id="btn-fs" type="button" aria-label="Pantalla completa" title="Pantalla completa">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<script src="totem.js"></script>
</body>
</html>
